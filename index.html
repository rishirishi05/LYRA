<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSetu - SIH 2026 Working Prototype</title>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons Helper Component wrapper for Lucide Icons
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // Prototype State Mock Data
        const initialListings = [
            {
                id: "AGR-1092",
                crop: "Fresh Tomatoes",
                category: "Vegetables",
                quantity: "250 kg",
                pricePerKg: 28,
                eNamRate: 22,
                grade: "A Grade (94% Freshness)",
                farmer: "Ramesh Patel",
                location: "Khed Micro-Hub, Pune",
                fpo: "Sahyadri Farmer Producer Co.",
                harvestDate: "2026-03-24",
                escrowStatus: "Locked in Smart Contract",
                logistics: "Shared Dairy Freight Van #4",
                image: "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400&q=80"
            },
            {
                id: "AGR-1093",
                crop: "Organic Potatoes",
                category: "Tubers",
                quantity: "500 kg",
                pricePerKg: 18,
                eNamRate: 15,
                grade: "A Grade (91% Quality)",
                farmer: "Sunita Devi",
                location: "Anand Hub, Gujarat",
                fpo: "Amul Agro Collective",
                harvestDate: "2026-03-23",
                escrowStatus: "Ready for Listing",
                logistics: "Pending Buyer Match",
                image: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=400&q=80"
            }
        ];

        function AgriSetuApp() {
            // Core Application States
            const [userRole, setUserRole] = useState('farmer'); // 'farmer' | 'buyer'
            const [language, setLanguage] = useState('English'); // English, Hindi, Tamil, Marathi
            const [activeTab, setActiveTab] = useState('marketplace'); // marketplace, voice, AI, ledger, forecast
            const [listings, setListings] = useState(initialListings);
            
            // New Crop Listing Form State (Farmer)
            const [newCrop, setNewCrop] = useState({
                crop: '',
                quantity: '',
                photoUrl: '',
                gradeResult: null,
                aiAnalyzing: false,
                eNamFloorPrice: 0,
                suggestedPrice: 0,
                farmerPrice: 0
            });

            // Voice Simulation State
            const [isListening, setIsListening] = useState(false);
            const [voiceTranscript, setVoiceTranscript] = useState('');

            // Smart Contract / Order Processing State
            const [selectedListing, setSelectedListing] = useState(null);
            const [txHash, setTxHash] = useState(null);
            const [orderSuccess, setOrderSuccess] = useState(false);

            // Trigger AI Photo Analysis
            const handleSimulateAiGrading = () => {
                setNewCrop(prev => ({ ...prev, aiAnalyzing: true }));
                setTimeout(() => {
                    const mockEnam = Math.floor(Math.random() * 15) + 20;
                    setNewCrop(prev => ({
                        ...prev,
                        aiAnalyzing: false,
                        gradeResult: {
                            grade: "Grade A",
                            confidence: "95.8%",
                            defects: "None detected",
                            colorIndex: "Optimal Red",
                            shelfLife: "7-9 Days"
                        },
                        eNamFloorPrice: mockEnam,
                        suggestedPrice: mockEnam + 5,
                        farmerPrice: mockEnam + 5
                    }));
                }, 2000);
            };

            // Voice Command Simulation
            const handleVoiceListing = () => {
                setIsListening(true);
                setVoiceTranscript("Listening...");
                setTimeout(() => {
                    setVoiceTranscript("I want to list 300 kg of fresh onions harvested today from Nashik hub.");
                    setIsListening(false);
                    setNewCrop(prev => ({
                        ...prev,
                        crop: 'Nashik Red Onions',
                        quantity: '300 kg'
                    }));
                }, 2500);
            };

            // Smart Contract Execution Simulation
            const handleExecutePurchase = (listing) => {
                const mockHash = "0x" + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
                setTxHash(mockHash);
                setOrderSuccess(true);
                setTimeout(() => {
                    setListings(prev => prev.map(item => 
                        item.id === listing.id ? {...item, escrowStatus: 'Funds Locked in Escrow'} : item
                    ));
                }, 1000);
            };

            return (
                <div className="flex-1 flex flex-col max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
                    {/* Header Bar */}
                    <header className="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-xl">
                        <div className="flex items-center space-x-3">
                            <div className="bg-emerald-500 p-2.5 rounded-xl text-slate-900 font-bold flex items-center justify-center">
                                <Icon name="sprout" className="w-7 h-7" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                                    AgriSetu <span className="text-xs font-semibold px-2 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full">SIH 2026 Winner Prototype</span>
                                </h1>
                                <p className="text-xs text-slate-400">Direct AI + Blockchain Farm-to-Fork Engine</p>
                            </div>
                        </div>

                        {/* Top Controls: Language & Role Switcher */}
                        <div className="flex flex-wrap items-center gap-3">
                            {/* Role Toggle */}
                            <div className="bg-slate-900 p-1 rounded-xl border border-slate-700 flex">
                                <button 
                                    onClick={() => setUserRole('farmer')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${
                                        userRole === 'farmer' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                                    }`}>
                                    <Icon name="tractor" className="w-3.5 h-3.5" />
                                    Farmer Mode
                                </button>
                                <button 
                                    onClick={() => setUserRole('buyer')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 ${
                                        userRole === 'buyer' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                                    }`}>
                                    <Icon name="shopping-bag" className="w-3.5 h-3.5" />
                                    Buyer / Consumer
                                </button>
                            </div>

                            {/* Language Selector */}
                            <div className="flex items-center gap-1 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700 text-xs text-slate-300">
                                <Icon name="languages" className="w-4 h-4 text-emerald-400" />
                                <select 
                                    value={language} 
                                    onChange={(e) => setLanguage(e.target.value)}
                                    className="bg-transparent font-medium focus:outline-none text-white cursor-pointer">
                                    <option value="English" className="bg-slate-800">English</option>
                                    <option value="Hindi" className="bg-slate-800">हिंदी (Hindi)</option>
                                    <option value="Tamil" className="bg-slate-800">தமிழ் (Tamil)</option>
                                    <option value="Marathi" className="bg-slate-800">मराठी (Marathi)</option>
                                </select>
                            </div>
                        </div>
                    </header>

                    {/* App Navigation Tabs */}
                    <nav className="flex flex-wrap gap-2 border-b border-slate-800 pb-2">
                        <button 
                            onClick={() => setActiveTab('marketplace')}
                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition ${
                                activeTab === 'marketplace' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                            }`}>
                            <Icon name="store" className="w-4 h-4" /> Direct Marketplace
                        </button>
                        {userRole === 'farmer' && (
                            <button 
                                onClick={() => setActiveTab('add-crop')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition ${
                                    activeTab === 'add-crop' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                                }`}>
                                <Icon name="plus-circle" className="w-4 h-4" /> List Produce (AI + Voice)
                            </button>
                        )}
                        <button 
                            onClick={() => setActiveTab('blockchain')}
                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition ${
                                activeTab === 'blockchain' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                            }`}>
                            <Icon name="shield-check" className="w-4 h-4" /> Smart Contract Escrow
                        </button>
                        <button 
                            onClick={() => setActiveTab('ledger')}
                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition ${
                                activeTab === 'ledger' ? 'bg-blue-500/10 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                            }`}>
                            <Icon name="credit-card" className="w-4 h-4" /> Credit Ledger Score
                        </button>
                        <button 
                            onClick={() => setActiveTab('forecast')}
                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition ${
                                activeTab === 'forecast' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                            }`}>
                            <Icon name="line-chart" className="w-4 h-4" /> Demand Forecast AI
                        </button>
                    </nav>

                    {/* MAIN CONTENT PANELS */}

                    {/* TAB 1: DIRECT MARKETPLACE */}
                    {activeTab === 'marketplace' && (
                        <div className="space-y-6">
                            {/* Price Breakdown Banner explaining elimination of intermediaries */}
                            <div className="bg-gradient-to-r from-emerald-950 via-slate-900 to-slate-900 border border-emerald-500/30 rounded-2xl p-5 flex flex-col md:flex-row items-center justify-between gap-4">
                                <div className="space-y-1">
                                    <div className="flex items-center gap-2 text-emerald-400 font-bold text-sm">
                                        <Icon name="sparkles" className="w-4 h-4" />
                                        Intermediary Elimination Impact
                                    </div>
                                    <p className="text-sm text-slate-300">
                                        Traditional Mandi Chain: Farmers get <span className="text-red-400 font-bold">42%</span> of consumer price. 
                                        AgriSetu Rail: Farmers receive <span className="text-emerald-400 font-bold">85%</span> direct realization.
                                    </p>
                                </div>
                                <div className="flex items-center gap-3 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700 text-xs">
                                    <div>
                                        <span className="text-slate-400 block">Typical Consumer Price</span>
                                        <span className="text-white font-bold text-base">₹40/kg</span>
                                    </div>
                                    <Icon name="arrow-right" className="w-4 h-4 text-emerald-400" />
                                    <div>
                                        <span className="text-slate-400 block">Farmer Pay (AgriSetu)</span>
                                        <span className="text-emerald-400 font-bold text-base">₹34/kg</span>
                                    </div>
                                </div>
                            </div>

                            {/* Active Listings Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {listings.map((item) => (
                                    <div key={item.id} className="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden hover:border-slate-600 transition flex flex-col justify-between">
                                        <div>
                                            <div className="relative h-48 bg-slate-900">
                                                <img src={item.image} alt={item.crop} className="w-full h-full object-cover" />
                                                <div className="absolute top-3 left-3 bg-slate-900/90 backdrop-blur px-2.5 py-1 rounded-lg border border-slate-700 text-xs font-semibold text-emerald-400 flex items-center gap-1">
                                                    <Icon name="check-circle" className="w-3.5 h-3.5" /> {item.grade}
                                                </div>
                                                <div className="absolute top-3 right-3 bg-slate-900/90 backdrop-blur px-2.5 py-1 rounded-lg border border-slate-700 text-xs font-bold text-white">
                                                    {item.id}
                                                </div>
                                            </div>

                                            <div className="p-5 space-y-4">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h3 className="text-xl font-bold text-white">{item.crop}</h3>
                                                        <p className="text-xs text-slate-400 flex items-center gap-1 mt-1">
                                                            <Icon name="map-pin" className="w-3.5 h-3.5 text-slate-500" />
                                                            {item.location} ({item.fpo})
                                                        </p>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="text-2xl font-black text-emerald-400">₹{item.pricePerKg}</span>
                                                        <span className="text-xs text-slate-400 font-normal"> / kg</span>
                                                        <span className="block text-[10px] text-slate-500">e-NAM Mandi Base: ₹{item.eNamRate}/kg</span>
                                                    </div>
                                                </div>

                                                {/* Price Transparency Breakdown */}
                                                <div className="bg-slate-900/70 p-3 rounded-xl border border-slate-700/60 space-y-2 text-xs">
                                                    <div className="flex justify-between text-slate-300">
                                                        <span className="text-slate-400">Farmer Share (85%)</span>
                                                        <span className="font-semibold text-emerald-400">₹{(item.pricePerKg * 0.85).toFixed(1)}/kg</span>
                                                    </div>
                                                    <div className="flex justify-between text-slate-300">
                                                        <span className="text-slate-400">Hub Aggregation & Freight (12%)</span>
                                                        <span>₹{(item.pricePerKg * 0.12).toFixed(1)}/kg</span>
                                                    </div>
                                                    <div className="flex justify-between text-slate-300">
                                                        <span className="text-slate-400">AgriSetu Rail Fee (3%)</span>
                                                        <span>₹{(item.pricePerKg * 0.03).toFixed(1)}/kg</span>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-2 gap-2 text-xs text-slate-300 pt-1">
                                                    <div className="bg-slate-900/40 p-2 rounded-lg border border-slate-800">
                                                        <span className="text-slate-500 block">Available Quantity</span>
                                                        <span className="font-bold text-white">{item.quantity}</span>
                                                    </div>
                                                    <div className="bg-slate-900/40 p-2 rounded-lg border border-slate-800">
                                                        <span className="text-slate-500 block">Shared Transport</span>
                                                        <span className="font-semibold text-slate-200">{item.logistics}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="p-5 pt-0">
                                            {userRole === 'buyer' ? (
                                                <button 
                                                    onClick={() => handleExecutePurchase(item)}
                                                    className="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition flex items-center justify-center gap-2">
                                                    <Icon name="lock" className="w-4 h-4" />
                                                    Buy Direct & Lock Escrow
                                                </button>
                                            ) : (
                                                <div className="flex items-center justify-between text-xs text-slate-400 bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-700">
                                                    <span>Smart Contract Escrow:</span>
                                                    <span className="text-purple-400 font-mono font-semibold">{item.escrowStatus}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* TAB 2: LIST PRODUCE (AI & VOICE INTEGRATION) */}
                    {activeTab === 'add-crop' && (
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-6 max-w-3xl mx-auto w-full">
                            <div>
                                <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                    <Icon name="plus-circle" className="w-5 h-5 text-emerald-400" />
                                    Zero-Literacy Produce Listing
                                </h2>
                                <p className="text-xs text-slate-400 mt-1">Use Multilingual Voice input or Computer Vision AI photo grading to list crop.</p>
                            </div>

                            {/* Voice Input Section */}
                            <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                                <label className="text-xs font-semibold text-slate-300 block">Option A: Voice Listing (WhatsApp / IVR Direct)</label>
                                <div className="flex items-center gap-3">
                                    <button 
                                        onClick={handleVoiceListing}
                                        className={`px-4 py-2.5 rounded-xl font-semibold text-xs flex items-center gap-2 transition ${
                                            isListening ? 'bg-red-500 text-white animate-pulse' : 'bg-emerald-600 hover:bg-emerald-500 text-white'
                                        }`}>
                                        <Icon name="mic" className="w-4 h-4" />
                                        {isListening ? 'Listening in Hindi/Marathi...' : 'Tap & Speak (Voice Command)'}
                                    </button>
                                    <span className="text-xs text-slate-400 italic">{voiceTranscript || "e.g., '300 kg onions from Nashik hub'"}</span>
                                </div>
                            </div>

                            {/* Form Input & AI Grading */}
                            <div className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs text-slate-400 mb-1 block">Crop Name</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Red Onions" 
                                            value={newCrop.crop}
                                            onChange={(e) => setNewCrop({...newCrop, crop: e.target.value})}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 mb-1 block">Quantity (kg/Quintal)</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. 300 kg" 
                                            value={newCrop.quantity}
                                            onChange={(e) => setNewCrop({...newCrop, quantity: e.target.value})}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                                        />
                                    </div>
                                </div>

                                {/* Computer Vision Photo Grading Simulation */}
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3">
                                    <label className="text-xs font-semibold text-slate-300 block">Option B: Computer Vision AI Produce Quality Scan</label>
                                    <div className="flex flex-wrap items-center gap-3">
                                        <button 
                                            onClick={handleSimulateAiGrading}
                                            disabled={newCrop.aiAnalyzing}
                                            className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-semibold flex items-center gap-2">
                                            <Icon name="camera" className="w-4 h-4" />
                                            {newCrop.aiAnalyzing ? 'AI Quality Scanning...' : 'Simulate Camera Quality Scan'}
                                        </button>
                                    </div>

                                    {newCrop.gradeResult && (
                                        <div className="mt-3 p-3 bg-purple-950/40 border border-purple-500/40 rounded-xl space-y-2 text-xs">
                                            <div className="flex justify-between text-purple-300 font-bold">
                                                <span>AI Grade Output: {newCrop.gradeResult.grade}</span>
                                                <span>Confidence: {newCrop.gradeResult.confidence}</span>
                                            </div>
                                            <p className="text-slate-300">Shelf Life Est: {newCrop.gradeResult.shelfLife} | Color Index: {newCrop.gradeResult.colorIndex}</p>
                                        </div>
                                    )}
                                </div>

                                {/* Dynamic Fair-Price Engine Output */}
                                {newCrop.eNamFloorPrice > 0 && (
                                    <div className="bg-slate-900 p-4 rounded-xl border border-emerald-500/40 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-emerald-400 flex items-center gap-1">
                                                <Icon name="trending-up" className="w-4 h-4" />
                                                AI Fair-Price Engine Recommendation
                                            </span>
                                            <span className="text-xs text-slate-400">Live e-NAM Benchmark: ₹{newCrop.eNamFloorPrice}/kg</span>
                                        </div>
                                        <div className="flex items-center justify-between gap-4">
                                            <span className="text-sm text-slate-200">Recommended Direct Selling Price:</span>
                                            <span className="text-xl font-bold text-emerald-400">₹{newCrop.suggestedPrice} / kg</span>
                                        </div>
                                    </div>
                                )}

                                <button 
                                    onClick={() => {
                                        if(!newCrop.crop) return;
                                        const newItem = {
                                            id: `AGR-${Math.floor(1000 + Math.random() * 9000)}`,
                                            crop: newCrop.crop,
                                            category: "Produce",
                                            quantity: newCrop.quantity || "200 kg",
                                            pricePerKg: newCrop.suggestedPrice || 25,
                                            eNamRate: newCrop.eNamFloorPrice || 20,
                                            grade: newCrop.gradeResult ? newCrop.gradeResult.grade : "Grade A",
                                            farmer: "Ramesh Patel (You)",
                                            location: "Local FPO Micro-Hub",
                                            fpo: "Local Cooperative",
                                            harvestDate: new Date().toISOString().split('T')[0],
                                            escrowStatus: "Listed on Smart Contract",
                                            logistics: "Shared Freight Fleet #2",
                                            image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400&q=80"
                                        };
                                        setListings([newItem, ...listings]);
                                        setActiveTab('marketplace');
                                    }}
                                    className="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition">
                                    Confirm & Publish Listing to Direct Marketplace
                                </button>
                            </div>
                        </div>
                    )}

                    {/* TAB 3: SMART CONTRACT & BLOCKCHAIN ESCROW */}
                    {activeTab === 'blockchain' && (
                        <div className="space-y-6">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                            <Icon name="shield-check" className="w-5 h-5 text-purple-400" />
                                            Polygon Smart Contract Escrow Ledger
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-0.5">Eliminating delayed payments & buyer default risk via automated escrow</p>
                                    </div>
                                    <span className="px-3 py-1 bg-purple-500/20 text-purple-400 border border-purple-500/30 rounded-full text-xs font-mono">
                                        Network: Polygon PoS
                                    </span>
                                </div>

                                {txHash && (
                                    <div className="p-4 bg-purple-950/60 border border-purple-500/50 rounded-xl space-y-2 text-xs">
                                        <div className="flex items-center justify-between text-purple-300 font-bold">
                                            <span className="flex items-center gap-1.5">
                                                <Icon name="check-circle" className="w-4 h-4 text-emerald-400" />
                                                Escrow Execution Confirmed
                                            </span>
                                            <span className="text-slate-400 font-mono">Block #4829104</span>
                                        </div>
                                        <p className="font-mono text-slate-300 break-all">TxHash: {txHash}</p>
                                        <p className="text-slate-400">Status: Funds locked in smart contract escrow. Auto-releases to farmer bank account upon OTP delivery confirmation at hub.</p>
                                    </div>
                                )}

                                {/* Visual Flowchart of Blockchain Settlement */}
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs pt-2">
                                    <div className="p-3 bg-slate-900 rounded-xl border border-slate-700 space-y-1">
                                        <span className="text-purple-400 font-bold block">1. Deal Match</span>
                                        <p className="text-slate-400">Buyer confirms price on marketplace rail.</p>
                                    </div>
                                    <div className="p-3 bg-slate-900 rounded-xl border border-slate-700 space-y-1">
                                        <span className="text-purple-400 font-bold block">2. Lock Funds</span>
                                        <p className="text-slate-400">Buyer payment locked in Polygon Smart Contract.</p>
                                    </div>
                                    <div className="p-3 bg-slate-900 rounded-xl border border-slate-700 space-y-1">
                                        <span className="text-purple-400 font-bold block">3. Micro-Hub Dispatch</span>
                                        <p className="text-slate-400">FPO aggregates and dispatches via shared route freight.</p>
                                    </div>
                                    <div className="p-3 bg-slate-900 rounded-xl border border-slate-700 space-y-1">
                                        <span className="text-emerald-400 font-bold block">4. OTP Auto-Release</span>
                                        <p className="text-slate-400">Delivery verified via QR/OTP; instant same-day payout.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 4: FARMER CREDIT LEDGER & ALTERNATIVE SCORE */}
                    {activeTab === 'ledger' && (
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-6">
                            <div className="flex flex-wrap items-center justify-between gap-4">
                                <div>
                                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                        <Icon name="credit-card" className="w-5 h-5 text-blue-400" />
                                        Alternative Credit Ledger & Score
                                    </h2>
                                    <p className="text-xs text-slate-400 mt-0.5">Bypassing predatory moneylenders through bank integration with immutable sales history.</p>
                                </div>
                                <div className="bg-blue-950/60 border border-blue-500/40 px-4 py-2 rounded-xl text-right">
                                    <span className="text-[10px] text-slate-400 block uppercase font-bold tracking-wider">AgriSetu Credit Score</span>
                                    <span className="text-2xl font-black text-blue-400">785 / 850</span>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-1">
                                    <span className="text-xs text-slate-400">Season Delivery Fulfillment</span>
                                    <span className="text-xl font-bold text-emerald-400 block">98.2%</span>
                                    <span className="text-[10px] text-slate-500">24 of 25 trades fulfilled on time</span>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-1">
                                    <span className="text-xs text-slate-400">Total Direct Payout Received</span>
                                    <span className="text-xl font-bold text-white block">₹1,84,500</span>
                                    <span className="text-[10px] text-slate-500">Processed via smart contract escrow</span>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-1">
                                    <span className="text-xs text-slate-400">Pre-Approved Micro-Credit Limit</span>
                                    <span className="text-xl font-bold text-blue-400 block">₹75,000</span>
                                    <span className="text-[10px] text-slate-500">Collateral-free partner bank loan</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 5: DEMAND FORECASTING AI */}
                    {activeTab === 'forecast' && (
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 space-y-6">
                            <div>
                                <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                    <Icon name="line-chart" className="w-5 h-5 text-amber-400" />
                                    Demand-Forecast & Crop Advisory AI
                                </h2>
                                <p className="text-xs text-slate-400 mt-0.5">Prevents harvest gluts by analyzing regional consumption signals before sowing.</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="p-4 bg-slate-900 rounded-xl border border-amber-500/30 space-y-2">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-white text-sm">High Expected Demand (Next Season)</span>
                                        <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-[10px] rounded font-bold">+35% Deficit</span>
                                    </div>
                                    <h3 className="text-lg font-bold text-amber-400">Yellow Bell Peppers / Capsicum</h3>
                                    <p className="text-xs text-slate-300">
                                        Urban hotel & hostel clusters in Pune showing high advance purchasing orders. Recommended sowing window: Next 15 days.
                                    </p>
                                </div>

                                <div className="p-4 bg-slate-900 rounded-xl border border-red-500/30 space-y-2">
                                    <div className="flex justify-between items-center">
                                        <span className="font-bold text-white text-sm">Over-Supply / Harvest Glut Risk</span>
                                        <span className="px-2 py-0.5 bg-red-500/20 text-red-400 text-[10px] rounded font-bold">Glut Warning</span>
                                    </div>
                                    <h3 className="text-lg font-bold text-red-400">Standard Cabbage</h3>
                                    <p className="text-xs text-slate-300">
                                        Regional production in adjacent districts is expected to exceed demand by 40%. Lower market realization expected.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer / Credits */}
                    <footer className="border-t border-slate-800 pt-4 flex flex-wrap justify-between items-center text-xs text-slate-500 gap-2">
                        <span>AgriSetu — SIH 2026 Problem Statement Solution</span>
                        <span>Built with AI, Polygon Smart Contracts & Bhashini Voice APIs</span>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AgriSetuApp />);
    </script>
</body>
</html>
