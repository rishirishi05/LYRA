                                            <span className="text-onion-300">Calculated Final Settlement Rate:</span>
                                            <span className="font-black text-skin-300 text-sm">₹21.50 / kg</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-onion-900/40 p-4 rounded-xl border border-onion-800 space-y-3">
                                    <h4 className="text-xs font-bold text-white uppercase tracking-wider text-skin-300">Annotated Sample Evidence</h4>
                                    <div className="relative h-32 rounded-lg overflow-hidden border border-onion-700 bg-black">
                                        <img src={uploadedImage} alt="Sample annotated" className="w-full h-full object-cover opacity-80" />
                                        <div className="absolute inset-0 bg-black/40 flex items-center justify-center text-xs font-bold text-white">
                                            Annotated Defect Overlay Saved to Object Storage
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Cryptographic Hash Verification Banner */}
                            <div className="bg-black/60 p-4 rounded-xl border border-onion-800 space-y-1.5 font-mono text-xs">
                                <div className="flex items-center justify-between text-onion-300">
                                    <span className="flex items-center gap-1.5 font-bold text-skin-300">
                                        <Icon name="shield-check" className="w-4 h-4 text-emerald-400" />
                                        {t.hashText}
                                    </span>
                                    <span className="text-[10px] text-onion-500">Tamper-Proof Ledger Stamp</span>
                                </div>
                                <p className="text-onion-200 text-[11px] break-all">{reportHash}</p>
                            </div>

                            {/* Joint Digital Acknowledgment Signatures */}
                            <div className="border-t border-onion-800 pt-5 space-y-4">
                                <h4 className="text-xs font-bold text-white">Joint Digital Acknowledgment before Settlement</h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {/* Inspector Acknowledgment */}
                                    <div className="p-3.5 bg-onion-900/60 rounded-xl border border-emerald-500/40 flex items-center justify-between">
                                        <div className="space-y-0.5">
                                            <span className="text-[11px] text-onion-300 block">Procurement Officer</span>
                                            <span className="text-xs font-bold text-white">R. K. Shinde (ID: #4092)</span>
                                        </div>
                                        <span className="px-2.5 py-1 bg-emerald-950 text-emerald-300 text-[10px] font-bold rounded-lg border border-emerald-700/60 flex items-center gap-1">
                                            <Icon name="check" className="w-3 h-3" /> Signed
                                        </span>
                                    </div>

                                    {/* Farmer Acknowledgment */}
                                    <div className="p-3.5 bg-onion-900/60 rounded-xl border border-onion-700 flex items-center justify-between">
                                        <div className="space-y-0.5">
                                            <span className="text-[11px] text-onion-300 block">Farmer Confirmation</span>
                                            <span className="text-xs font-bold text-white">Suresh Patil</span>
                                        </div>
                                        {isSignedByFarmer ? (
                                            <span className="px-2.5 py-1 bg-emerald-950 text-emerald-300 text-[10px] font-bold rounded-lg border border-emerald-700/60 flex items-center gap-1">
                                                <Icon name="check" className="w-3 h-3" /> Signed
                                            </span>
                                        ) : (
                                            <button 
                                                onClick={() => setIsSignedByFarmer(true)}
                                                className="px-3 py-1.5 bg-skin-400 hover:bg-skin-300 text-onion-950 font-bold text-xs rounded-lg transition shadow">
                                                {t.signOff}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>

                        </div>
                    )}

                    {/* TAB 3: DISPUTE APPEALS & RE-EXAMINATION */}
                    {activeTab === 'disputes' && (
                        <div className="space-y-6">
                            <div className="bg-onion-950 border border-onion-800 rounded-2xl p-6 space-y-4 shadow-xl">
                                <div className="flex flex-wrap items-center justify-between gap-3">
                                    <div>
                                        <h2 className="text-xl font-extrabold text-white flex items-center gap-2">
                                            <Icon name="scale" className="w-5 h-5 text-amber-400" />
                                            Evidence-Based Dispute Resolution Portal
                                        </h2>
                                        <p className="text-xs text-onion-300 mt-0.5">
                                            Eliminating subjective arguments by re-examining exact annotated photo evidence
                                        </p>
                                    </div>
                                    <span className="px-3 py-1 bg-amber-950 text-amber-300 border border-amber-700/50 rounded-full text-xs font-bold">
                                        SLA: 24-Hour Appeal Window
                                    </span>
                                </div>

                                {/* Active Dispute Instance Simulation */}
                                <div className="bg-onion-900/60 border border-amber-500/30 rounded-xl p-5 space-y-4">
                                    <div className="flex flex-wrap items-center justify-between gap-2 border-b border-onion-800 pb-3">
                                        <div>
                                            <span className="text-xs text-amber-400 font-bold">Case #DISP-2026-8819</span>
                                            <h3 className="text-sm font-bold text-white">Disputed Grade: Lot #ON-2026-0941</h3>
                                        </div>
                                        <div className="text-right text-xs">
                                            <span className="text-onion-300 block">AI Baseline: 28% URS</span>
                                            <span className="text-amber-400 font-bold">Farmer Claims: 15% URS</span>
                                        </div>
                                    </div>

                                    {/* Visual Evidence Comparison */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                        <div className="space-y-2">
                                            <span className="font-semibold text-onion-200 block">1. Captured Image Evidence Overlay:</span>
                                            <div className="relative h-40 bg-black rounded-lg overflow-hidden border border-onion-700">
                                                <img src={uploadedImage} alt="Annotated dispute" className="w-full h-full object-cover opacity-80" />
                                                <div className="absolute bottom-2 left-2 bg-black/80 px-2 py-1 rounded text-[10px] text-rose-400 font-bold">
                                                    Bulbs #4, #5, #6 Flagged as URS
                                                </div>
                                            </div>
                                        </div>

                                        <div className="space-y-3 bg-onion-950 p-4 rounded-lg border border-onion-800 flex flex-col justify-between">
                                            <div className="space-y-1.5">
                                                <span className="font-bold text-white block">Supervisor Re-Examination Action</span>
                                                <p className="text-onion-300 text-[11px]">
                                                    Supervisor reviews annotated visual trace. Corrected judgment feeds directly into retraining loop.
                                                </p>
                                            </div>

                                            {disputeFiled ? (
                                                <div className="p-3 bg-emerald-950 border border-emerald-600 rounded-lg text-emerald-300 text-xs font-bold">
                                                    Dispute Resolved & Retraining Loop Updated!
                                                </div>
                                            ) : (
                                                <div className="flex gap-2">
                                                    <button 
                                                        onClick={() => setDisputeFiled(true)}
                                                        className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition">
                                                        Uphold AI Assessment
                                                    </button>
                                                    <button 
                                                        onClick={() => setDisputeFiled(true)}
                                                        className="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-xs transition">
                                                        Override & Retrain AI
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 4: STATE & APMC DISPUTE ANALYTICS DASHBOARD */}
                    {activeTab === 'analytics' && (
                        <div className="space-y-6">
                            <div className="bg-onion-950 border border-onion-800 rounded-2xl p-6 space-y-6 shadow-xl">
                                <div>
                                    <h2 className="text-xl font-extrabold text-white flex items-center gap-2">
                                        <Icon name="bar-chart-3" className="w-5 h-5 text-emerald-400" />
                                        State Agriculture Board Dispute Analytics
                                    </h2>
                                    <p className="text-xs text-onion-300 mt-0.5">
                                        Monitoring center-to-center grading consistency and surfacing human override bias
                                    </p>
                                </div>

                                {/* Summary Stats */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="bg-onion-900/60 p-4 rounded-xl border border-onion-800 space-y-1">
                                        <span className="text-xs text-onion-400 block font-medium">Total Procurement Lots Graded</span>
                                        <span className="text-2xl font-black text-white">14,280 Lots</span>
                                        <span className="text-[10px] text-emerald-400 font-bold block">Across 18 Procurement Mandis</span>
                                    </div>
                                    <div className="bg-onion-900/60 p-4 rounded-xl border border-onion-800 space-y-1">
                                        <span className="text-xs text-onion-400 block font-medium">Average Dispute Rate</span>
                                        <span className="text-2xl font-black text-skin-300">1.8%</span>
                                        <span className="text-[10px] text-emerald-400 font-bold block">↓ 84% reduction vs manual grading</span>
                                    </div>
                                    <div className="bg-onion-900/60 p-4 rounded-xl border border-onion-800 space-y-1">
                                        <span className="text-xs text-onion-400 block font-medium">Model Consistency Kappa Score</span>
                                        <span className="text-2xl font-black text-emerald-400">0.94 / 1.0</span>
                                        <span className="text-[10px] text-onion-300 block">High Inter-Center Standardization</span>
                                    </div>
                                </div>

                                {/* APMC Center Variance Table */}
                                <div className="space-y-3">
                                    <h3 className="text-sm font-bold text-white">Center-to-Center AI vs Manual Discrepancy Monitor</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs">
                                            <thead>
                                                <tr className="border-b border-onion-800 text-onion-400">
                                                    <th className="py-2.5 px-3 font-semibold">Procurement Center</th>
                                                    <th className="py-2.5 px-3 font-semibold">Manual Grade-A %</th>
                                                    <th className="py-2.5 px-3 font-semibold">AI Baseline Grade-A %</th>
                                                    <th className="py-2.5 px-3 font-semibold">Variance Gap</th>
                                                    <th className="py-2.5 px-3 font-semibold">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-onion-900 text-onion-200">
                                                {apmcCentersData.map((center, index) => (
                                                    <tr key={index} className="hover:bg-onion-900/40 transition">
                                                        <td className="py-3 px-3 font-bold text-white">{center.name}</td>
                                                        <td className="py-3 px-3">{center.manualAvgA}%</td>
                                                        <td className="py-3 px-3 text-emerald-400 font-bold">{center.aiAvgA}%</td>
                                                        <td className="py-3 px-3 text-amber-400 font-semibold">{center.gap}</td>
                                                        <td className="py-3 px-3">
                                                            <span className={`px-2.5 py-1 rounded text-[10px] font-bold ${
                                                                center.status.includes('High') || center.status.includes('Audit')
                                                                ? 'bg-rose-950 text-rose-300 border border-rose-700/60'
                                                                : 'bg-emerald-950 text-emerald-300 border border-emerald-700/60'
                                                            }`}>
                                                                {center.status}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER & CREDITS */}
                    <footer className="border-t border-onion-800/80 pt-4 flex flex-wrap justify-between items-center text-xs text-onion-400 gap-2">
                        <div className="flex items-center gap-2">
                            <span className="font-bold text-white">LYRA</span>
                            <span>— Standardized AI Onion Grading Instrument</span>
                        </div>
                        <span>SIH 2026 Winner Prototype | Built for Mandi & APMC Procurement</span>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LyraApp />);
    </script>
</body>
</html>
